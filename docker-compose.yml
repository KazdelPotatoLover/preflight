services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: preflight
      POSTGRES_USER: preflight
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run setup first}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - preflight-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U preflight -d preflight"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  preflight-db:
